server {
    listen 443 ssl;
    server_name ledger.catudio.art;

    root /var/www/ledger.catudio.art;
    index index.html;

    access_log /var/log/nginx/ledger-access.log;
    error_log /var/log/nginx/ledger-error.log;

    ssl_certificate /etc/nginx/ssl/ledger.catudio.art/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/ledger.catudio.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    }

    location = /sw.js {
        add_header Cache-Control "no-cache" always;
    }

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        add_header Cache-Control "no-cache" always;
    }

    location ^~ /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ^~ /icons/ {
        try_files $uri =404;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 80;
    server_name ledger.catudio.art;
    return 301 https://ledger.catudio.art$request_uri;
}
