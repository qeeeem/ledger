location = /ledger {
    return 301 /ledger/;
}

location /ledger/ {
    alias /var/www/local-ledger/;
    try_files $uri $uri/ /ledger/index.html;
}

location = /ledger/index.html {
    alias /var/www/local-ledger/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}

location = /ledger/sw.js {
    alias /var/www/local-ledger/sw.js;
    add_header Cache-Control "no-cache" always;
}

location = /ledger/manifest.webmanifest {
    alias /var/www/local-ledger/manifest.webmanifest;
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
}
