server {
    listen 443 ssl default_server;
    server_name 8.148.157.132;

    client_max_body_size 10M;

    access_log /var/log/nginx/cat-comics-ip-access.log;
    error_log /var/log/nginx/cat-comics-ip-error.log;

    ssl_certificate /etc/nginx/ssl/8.148.157.132/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/8.148.157.132/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location = / {
        return 301 /app/landing.html;
    }

    location = /verify-email {
        default_type text/html;
        alias /root/cat_work_v3/frontend/verify-email.html;
    }

    location /app/ {
        alias /root/cat_work_v3/frontend/;
        try_files $uri $uri/ /app/index.html;

        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf)$ {
            expires 7d;
            add_header Cache-Control "public, immutable";
        }
    }

    include /etc/nginx/snippets/local-ledger.conf;

    location /api/ {
        proxy_pass http://cat_comics_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 300s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /root/cat_work_v3/output/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location /health {
        proxy_pass http://cat_comics_backend/api/health;
        access_log off;
    }
}
